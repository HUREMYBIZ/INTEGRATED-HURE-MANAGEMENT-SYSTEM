{% extends "base.html" %}{% block content %}<div class="receipt"><h2>QUOTATION</h2><p>No: {{quote.quote_no}}<br>Date: {{quote.created_at}}</p>{% for i in items %}<div>{{i.qty}} × Product #{{i.product_id}} — ₱{{"%.2f"|format(i.line_total)}}</div>{% endfor %}<hr><h2>Total: ₱{{"%.2f"|format(quote.total)}}</h2><button onclick="print()">PRINT</button> <a href="/quotation">NEW QUOTATION</a></div>{% endblock %}
