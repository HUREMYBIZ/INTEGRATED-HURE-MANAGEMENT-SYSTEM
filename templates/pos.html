{% extends "base.html" %}{% block content %}
<div class="toolbar"><h1>Sales / Cashier</h1>{% if shift %}<span class="badge">SHIFT OPEN</span>{% else %}<form method="post" action="/admin/shift/open" class="inline"><input name="opening_cash" type="number" step=".01" placeholder="Opening cash" required><button>OPEN SHIFT</button></form>{% endif %}</div>
<div class="posgrid">
<section>
  <input id="search" class="search" placeholder="Scan barcode or search product..." autofocus autocomplete="off">
  <div id="results" class="results"></div>
</section>
<section>
  <h2>Cart</h2><div id="cart"></div>
  <div class="totals">
    <p>Subtotal: <b>₱<span id="sub">0.00</span></b></p>
    <label>Discount<input id="discount" type="number" min="0" step=".01" value="0"></label>
    <h2>Total: ₱<span id="total">0.00</span></h2>
    <label>Payment type<select id="ptype"><option>Cash</option><option>Credit</option></select></label>
    <input id="pay" type="number" step=".01" placeholder="Cash received">
    <p>Change: <b>₱<span id="change">0.00</span></b></p>

    <div class="customer-box">
      <div class="customer-head"><b>Customer</b><div><button type="button" id="walkinBtn" class="customer-tab active">WALK-IN</button><button type="button" id="accountBtn" class="customer-tab">ACCOUNT CUSTOMER</button></div></div>
      <div id="walkinPanel"><div class="selected-customer">Walk-in Customer</div></div>
      <div id="accountPanel" style="display:none">
        <input id="customerSearch" class="search" placeholder="Search customer name or mobile number..." autocomplete="off">
        <div id="customerResults"></div>
        <div id="recentCustomers" class="recent-customers"></div>
        <div id="selectedCustomer" class="selected-customer" style="display:none"></div>
        <button type="button" id="newCustomerBtn" class="new-customer">+ NEW CUSTOMER</button>
      </div>
      <input type="hidden" id="customer" value="">
    </div>

    <div class="delivery-box">
      <div class="delivery-head"><b>ORDER / DELIVERY</b><label><input type="checkbox" id="deliveryToggle"> Delivery order</label></div>
      <div id="deliveryPanel" style="display:none">
        <div class="delivery-grid">
          <input id="deliveryAddress" placeholder="Delivery address *">
          <input id="deliveryContact" placeholder="Contact number">
          <input id="deliveryDate" type="date" title="Delivery date">
          <input id="driver" placeholder="Driver / delivery person">
          <input id="vehicle" placeholder="Vehicle / plate no.">
          <input id="checkedBy" placeholder="Checked by">
          <input id="receivedBy" placeholder="Received by">
          <input id="deliveryNotes" class="full" placeholder="Delivery notes / instructions">
        </div>
      </div>
    </div>

    <form method="post" action="/sale" id="saleForm"><input type="hidden" name="items" id="items"><input type="hidden" name="discount" id="hd"><input type="hidden" name="payment" id="hp"><input type="hidden" name="payment_type" id="ht"><input type="hidden" name="customer_id" id="hc"><input type="hidden" name="order_type" id="orderType" value="STORE"><input type="hidden" name="delivery_address" id="hdAddress"><input type="hidden" name="delivery_contact" id="hdContact"><input type="hidden" name="delivery_date" id="hdDate"><input type="hidden" name="driver" id="hdDriver"><input type="hidden" name="vehicle" id="hdVehicle"><input type="hidden" name="checked_by" id="hdChecked"><input type="hidden" name="received_by" id="hdReceived"><input type="hidden" name="delivery_notes" id="hdNotes"><button class="complete">COMPLETE SALE</button></form>
    {% if shift %}<form method="post" action="/admin/shift/close" class="inline"><input name="closing_cash" type="number" step=".01" placeholder="Closing cash" required><button class="danger">CLOSE SHIFT</button></form>{% endif %}
  </div>
</section>
</div>
<style>
.results{margin-top:10px}.product{display:flex;flex-direction:column;width:100%;text-align:left;margin:6px 0;padding:12px;border:1px solid #ddd;background:#fff;border-radius:7px;cursor:pointer}.product small{display:block;color:#666;margin-top:3px}.product strong{margin-top:5px}.customer-box{margin:14px 0;padding:12px;border:1px solid #ddd;border-radius:8px}.customer-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.customer-tab{border:1px solid #bbb;background:#eee;padding:7px 10px;border-radius:6px;font-size:12px}.customer-tab.active{font-weight:700}.customer-result{display:flex;flex-direction:column;width:100%;text-align:left;margin-top:5px;padding:9px;border:1px solid #ddd;background:#fff;border-radius:6px;cursor:pointer}.customer-result small,.selected-customer small{display:block;color:#666;margin-top:3px}.selected-customer{margin-top:8px;padding:10px;background:#f5f5f5;border-radius:6px}.selected-customer button{float:right}.new-customer{margin-top:8px;padding:8px 12px}.recent-title{font-size:12px;color:#666;margin-top:10px}.recent-customers{display:grid;gap:4px;margin-top:4px}.delivery-box{margin:12px 0;padding:12px;border:1px solid #ddd;border-radius:8px}.delivery-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.delivery-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.delivery-grid input{min-width:0}.delivery-grid .full{grid-column:1 / -1}.delivery-head label{font-size:12px}
</style>
<script>
(function(){
  const search=document.getElementById('search');
  const results=document.getElementById('results');
  const cartEl=document.getElementById('cart');
  const discount=document.getElementById('discount');
  const ptype=document.getElementById('ptype');
  const pay=document.getElementById('pay');
  const sub=document.getElementById('sub');
  const total=document.getElementById('total');
  const change=document.getElementById('change');
  const walkinBtn=document.getElementById('walkinBtn');
  const accountBtn=document.getElementById('accountBtn');
  const walkinPanel=document.getElementById('walkinPanel');
  const accountPanel=document.getElementById('accountPanel');
  const customerSearch=document.getElementById('customerSearch');
  const customerResults=document.getElementById('customerResults');
  const recentCustomers=document.getElementById('recentCustomers');
  const selectedCustomerBox=document.getElementById('selectedCustomer');
  const customerInput=document.getElementById('customer');
  const saleForm=document.getElementById('saleForm');
  const itemsInput=document.getElementById('items');
  const hd=document.getElementById('hd');
  const hp=document.getElementById('hp');
  const ht=document.getElementById('ht');
  const hc=document.getElementById('hc');
  const deliveryToggle=document.getElementById('deliveryToggle');
  const deliveryPanel=document.getElementById('deliveryPanel');
  const orderType=document.getElementById('orderType');
  const hdAddress=document.getElementById('hdAddress'),hdContact=document.getElementById('hdContact'),hdDate=document.getElementById('hdDate');
  const hdDriver=document.getElementById('hdDriver'),hdVehicle=document.getElementById('hdVehicle'),hdChecked=document.getElementById('hdChecked'),hdReceived=document.getElementById('hdReceived'),hdNotes=document.getElementById('hdNotes');
  let cart=[];
  let customerMode='walkin';
  let selectedCustomer=null;
  let searchTimer=null;

  const money=n=>(Number(n)||0).toFixed(2);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  async function findProducts(){
    const q=search.value.trim();
    if(!q){results.innerHTML='';return;}
    try{
      const r=await fetch('/api/products?q='+encodeURIComponent(q),{headers:{'Accept':'application/json'}});
      if(!r.ok) throw new Error('Product search failed');
      const a=await r.json();
      results.innerHTML=a.map(p=>`<button type="button" class="product" data-id="${p.id}"><b>${esc(p.name)}</b><small>${esc(p.sku)} · ${esc(p.brand)} · ${esc(p.specification)} · ${esc(p.unit)} · Stock ${p.stock}</small><strong>₱${money(p.price)}</strong></button>`).join('')||'<p>No product found.</p>';
      results.querySelectorAll('.product').forEach((btn,i)=>btn.addEventListener('click',()=>add(a[i])));
      if(a.length===1 && a[0].barcode && a[0].barcode.toLowerCase()===q.toLowerCase()) add(a[0]);
    }catch(e){ results.innerHTML='<p style="color:#b00">Unable to search products. Please refresh the page.</p>'; console.error(e); }
  }

  function add(p){
    const x=cart.find(i=>i.id===p.id);
    if(x)x.qty++; else cart.push({id:p.id,name:p.name,unit:p.unit,price:p.price,qty:1,stock:p.stock});
    search.value=''; results.innerHTML=''; render(); search.focus();
  }
  function render(){
    cartEl.innerHTML=cart.map((p,i)=>`<div class="line"><span>${esc(p.name)}<small>${esc(p.unit)} · ₱${money(p.price)}</small></span><input type="number" min=".001" max="${p.stock}" step=".001" value="${p.qty}" data-i="${i}"><b>₱${money(p.qty*p.price)}</b><button type="button" data-remove="${i}">×</button></div>`).join('')||'<p>Cart empty.</p>';
    cartEl.querySelectorAll('input[data-i]').forEach(el=>el.addEventListener('change',()=>{cart[Number(el.dataset.i)].qty=Math.max(.001,parseFloat(el.value)||1);render()}));
    cartEl.querySelectorAll('button[data-remove]').forEach(el=>el.addEventListener('click',()=>{cart.splice(Number(el.dataset.remove),1);render()}));
    const s=cart.reduce((a,p)=>a+p.qty*p.price,0),d=parseFloat(discount.value)||0,t=Math.max(0,s-d),p=parseFloat(pay.value)||0;
    sub.textContent=money(s); total.textContent=money(t); change.textContent=money(Math.max(0,p-t));
  }

  function setCustomerMode(mode){
    customerMode=mode; walkinBtn.classList.toggle('active',mode==='walkin'); accountBtn.classList.toggle('active',mode==='account'); walkinPanel.style.display=mode==='walkin'?'block':'none'; accountPanel.style.display=mode==='account'?'block':'none';
    if(mode==='account'){customerSearch.focus();loadCustomers('');} else {selectedCustomer=null;customerInput.value='';selectedCustomerBox.style.display='none';customerResults.innerHTML='';}
  }
  function customerButton(c){return `<button type="button" class="customer-result" data-cid="${c.id}"><b>${esc(c.name)}</b><small>${esc(c.contact||'No contact')} · Balance ₱${money(c.balance)}</small></button>`}
  async function loadCustomers(q){
    try{const r=await fetch('/api/customers?q='+encodeURIComponent(q||''),{headers:{'Accept':'application/json'}});if(!r.ok)throw new Error('Customer search failed');const a=await r.json();
      const unique=[];const seen=new Set();for(const c of a){if(!seen.has(c.id)){seen.add(c.id);unique.push(c)}}
      if(q){customerResults.innerHTML=unique.map(customerButton).join('')||'<p>No customer found.</p>';recentCustomers.innerHTML='';bindCustomerButtons(unique);}
      else{const recent=unique.slice(0,8);recentCustomers.innerHTML=recent.length?'<div class="recent-title">RECENT / FREQUENT CUSTOMERS</div>'+recent.map(customerButton).join(''):'';customerResults.innerHTML='';bindCustomerButtons(recent);}
    }catch(e){customerResults.innerHTML='<p style="color:#b00">Unable to load customers.</p>';console.error(e)}
  }
  function bindCustomerButtons(list){document.querySelectorAll('.customer-result').forEach((el,i)=>el.addEventListener('click',()=>chooseCustomer(list[i])))}
  function chooseCustomer(c){
    selectedCustomer=c;customerInput.value=c.id;customerResults.innerHTML='';recentCustomers.innerHTML='';customerSearch.value='';selectedCustomerBox.style.display='block';selectedCustomerBox.innerHTML=`<b>${esc(c.name)}</b><small>${esc(c.contact||'')} · Balance ₱${money(c.balance)}</small><button type="button" id="changeCustomer">CHANGE</button>`;document.getElementById('changeCustomer').addEventListener('click',()=>{selectedCustomer=null;customerInput.value='';selectedCustomerBox.style.display='none';customerSearch.focus();loadCustomers('')});
  }
  async function newCustomer(){
    const name=prompt('Customer name:');if(!name||!name.trim())return;const contact=prompt('Contact number (optional):')||'';const address=prompt('Address (optional):')||'';
    try{
      const fd=new FormData();fd.append('name',name.trim());fd.append('contact',contact);fd.append('address',address);
      const r=await fetch('/api/customers/create',{method:'POST',body:fd});if(!r.ok)throw new Error('Save failed');
      await loadCustomers(name.trim());
      const a=await (await fetch('/api/customers?q='+encodeURIComponent(name.trim()))).json();if(a.length)chooseCustomer(a[0]);
    }catch(e){alert('Unable to save customer.');console.error(e)}
  }

  search.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(findProducts,80)});
  search.addEventListener('keydown',e=>{if(e.key==='Enter'){const first=results.querySelector('.product');if(first){e.preventDefault();first.click()}}});
  discount.addEventListener('input',render); pay.addEventListener('input',render); ptype.addEventListener('change',()=>{if(ptype.value==='Credit')setCustomerMode('account');render()});
  walkinBtn.addEventListener('click',()=>setCustomerMode('walkin')); accountBtn.addEventListener('click',()=>setCustomerMode('account'));
  customerSearch.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>loadCustomers(customerSearch.value.trim()),120)});
  document.getElementById('newCustomerBtn').addEventListener('click',newCustomer);
  saleForm.addEventListener('submit',e=>{if(!cart.length){alert('Cart is empty');e.preventDefault();return}const t=parseFloat(total.textContent)||0,p=parseFloat(pay.value)||0;if(ptype.value==='Cash'&&p<t){alert('Insufficient cash');e.preventDefault();return}if(ptype.value==='Credit'&&(!customerInput.value||customerMode!=='account')){alert('Select an account customer');e.preventDefault();return}itemsInput.value=JSON.stringify(cart.map(x=>({id:x.id,qty:x.qty})));hd.value=discount.value;hp.value=ptype.value==='Cash'?p:t;ht.value=ptype.value;hc.value=customerInput.value;
    const isDelivery=deliveryToggle.checked; orderType.value=isDelivery?'DELIVERY':'STORE';
    if(isDelivery && !document.getElementById('deliveryAddress').value.trim()){alert('Enter the delivery address.');e.preventDefault();return;}
    hdAddress.value=document.getElementById('deliveryAddress').value.trim(); hdContact.value=document.getElementById('deliveryContact').value.trim(); hdDate.value=document.getElementById('deliveryDate').value;
    hdDriver.value=document.getElementById('driver').value.trim(); hdVehicle.value=document.getElementById('vehicle').value.trim(); hdChecked.value=document.getElementById('checkedBy').value.trim(); hdReceived.value=document.getElementById('receivedBy').value.trim(); hdNotes.value=document.getElementById('deliveryNotes').value.trim();
  });
  deliveryToggle.addEventListener('change',()=>{deliveryPanel.style.display=deliveryToggle.checked?'block':'none';orderType.value=deliveryToggle.checked?'DELIVERY':'STORE';});
  render();
})();
</script>{% endblock %}
