{% extends "base.html" %}{% block content %}<h1>Edit Product</h1><form class="grid" method="post"><input name="sku" value="{{product.sku}}" placeholder="SKU" required><input name="barcode" value="{{product.barcode or ''}}" placeholder="Barcode"><input name="name" value="{{product.name}}" placeholder="Product name" required><input name="brand" value="{{product.brand or ''}}" placeholder="Brand"><input name="specification" value="{{product.specification or ''}}" placeholder="Size / specification"><input name="unit" value="{{product.unit or 'piece'}}" placeholder="Unit"><input name="cost" type="number" step=".01" value="{{product.cost or 0}}" placeholder="Cost"><input name="price" type="number" step=".01" value="{{product.price or 0}}" placeholder="Retail price"><input name="wholesale_price" type="number" step=".01" value="{{product.wholesale_price or 0}}" placeholder="Wholesale price"><input name="minimum_stock" type="number" step=".001" value="{{product.minimum_stock or 0}}" placeholder="Minimum stock"><select name="category_id"><option value="">Category</option>{% for c in categories %}<option value="{{c.id}}" {% if product.category_id==c.id %}selected{% endif %}>{{c.name}}</option>{% endfor %}</select><select name="supplier_id"><option value="">Supplier</option>{% for s in suppliers %}<option value="{{s.id}}" {% if product.supplier_id==s.id %}selected{% endif %}>{{s.name}}</option>{% endfor %}</select><label><input type="checkbox" name="active" {% if product.active %}checked{% endif %}> Active product</label><button>SAVE CHANGES</button><a href="/admin">Cancel</a></form>{% endblock %}
