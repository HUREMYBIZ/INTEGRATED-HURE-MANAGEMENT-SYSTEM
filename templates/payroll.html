{% extends "base.html" %}{% block content %}<h1>Payroll Processing</h1><form method="post" class="panel formgrid"><input name="date_from" type="date" required><input name="date_to" type="date" required><select name="period_type"><option>Semi-monthly</option><option>Monthly</option></select><button class="primary">CREATE PAYROLL DRAFT</button></form><h2>Payroll History</h2><table><tr><th>Period</th><th>From</th><th>To</th><th>Status</th><th>Action</th></tr>{% for r in runs %}<tr><td>{{r.period_type}}</td><td>{{r.date_from}}</td><td>{{r.date_to}}</td><td>{{r.status}}</td><td><a href="/workforce/payroll/{{r.id}}">VIEW</a> · <a href="/workforce/payroll/{{r.id}}/print">PRINT</a></td></tr>{% endfor %}</table>{% endblock %}
