{% extends "base.html" %}{% block content %}<h1>Quotation</h1><div class="posgrid"><section><input id="qs" class="search" placeholder="Search product"><div id="qr"></div></section><section><div id="qc"></div><label>Customer<select id="customer"><option value="">Walk-in</option>{% for c in customers %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select></label><input id="discount" type="number" value="0" step=".01" placeholder="Discount"><form method="post" onsubmit="submitQ()"><input type="hidden" name="items" id="qi"><input type="hidden" name="customer_id" id="qcustomer"><input type="hidden" name="discount" id="qdiscount"><button>CREATE QUOTATION</button></form></section></div><script>
let qcart=[];qs.oninput=async()=>{let a=await(await fetch('/api/products?q='+encodeURIComponent(qs.value))).json();qr.innerHTML=a.map(p=>`<button class="product" onclick='qa(${JSON.stringify(p)})'>${p.name} — ₱${p.price.toFixed(2)}</button>`).join('')};function qa(p){let x=qcart.find(i=>i.id==p.id);if(x)x.qty++;else qcart.push({id:p.id,name:p.name,price:p.price,qty:1});qs.value='';qr.innerHTML='';rr()}function rr(){qc.innerHTML=qcart.map((x,i)=>`<div class=line>${x.name}<input type=number value=${x.qty} onchange="qcart[${i}].qty=parseFloat(this.value)||1;rr()"> ₱${(x.qty*x.price).toFixed(2)} <button onclick="qcart.splice(${i},1);rr()">×</button></div>`).join('')||'Empty'}function submitQ(){if(!qcart.length){alert('Empty quotation');event.preventDefault();return}qi.value=JSON.stringify(qcart.map(x=>({id:x.id,qty:x.qty})));qcustomer.value=customer.value;qdiscount.value=discount.value}rr();
</script>{% endblock %}
