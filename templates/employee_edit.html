{% extends "base.html" %}{% block content %}<h1>Edit Employee</h1><form method="post" class="panel formgrid"><input name="employee_no" value="{{e.employee_no}}" required><input name="first_name" value="{{e.first_name}}" required><input name="last_name" value="{{e.last_name}}" required><input name="department" value="{{e.department or ''}}"><input name="position" value="{{e.position or ''}}"><select name="employment_status">{% for x in ['Regular','Probationary','Project-based','Part-time'] %}<option {% if e.employment_status==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select><select name="salary_type"><option {% if e.salary_type=='Monthly' %}selected{% endif %}>Monthly</option><option {% if e.salary_type=='Daily' %}selected{% endif %}>Daily</option></select><input name="monthly_rate" type="number" step=".01" value="{{e.monthly_rate or 0}}"><input name="daily_rate" type="number" step=".01" value="{{e.daily_rate or 0}}"><input name="date_hired" type="date" value="{{e.date_hired or ''}}"><input name="contact" value="{{e.contact or ''}}"><input name="email" value="{{e.email or ''}}"><input name="address" value="{{e.address or ''}}"><input name="sss_no" value="{{e.sss_no or ''}}"><input name="philhealth_no" value="{{e.philhealth_no or ''}}"><input name="pagibig_no" value="{{e.pagibig_no or ''}}"><input name="tin_no" value="{{e.tin_no or ''}}"><select name="user_id"><option value="">POS user (optional)</option>{% for u in users %}<option value="{{u.id}}" {% if e.user_id==u.id %}selected{% endif %}>{{u.name}} · {{u.username}}</option>{% endfor %}</select><label><input type="checkbox" name="active" {% if e.active %}checked{% endif %}> Active employee</label><button class="primary">SAVE CHANGES</button><a href="/workforce/employees">Cancel</a></form>{% endblock %}
